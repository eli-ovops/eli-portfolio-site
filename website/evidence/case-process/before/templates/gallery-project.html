<article class="selected-project gallery-project poster-${skin}" data-gallery-type="${group}"${anchor}>
  <a class="project-image" data-tilt data-reveal="image" href="cases/${id}.html" aria-label="查看 ${title} 案例">
    <span class="poster-label">${label}<span aria-hidden="true">↗</span></span>
    <span class="poster-word" aria-hidden="true">${word}</span>
    ${visual}
    
    <span class="project-cursor" aria-hidden="true"><span>查看案例</span><span class="cursor-arrow">↗</span></span>
  </a>
  <div class="selected-caption"><h3><a href="cases/${id}.html">${title}<span aria-hidden="true">↗</span></a></h3><p class="project-summary">${summary}</p>${related}</div>
</article>
