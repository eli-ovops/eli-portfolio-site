<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>两页动效真实帧回放</title><style>body{margin:0;padding:24px;background:#111214;color:#f5f5f7;font-family:system-ui}main{max-width:1200px;margin:auto}h1{font-size:24px}p{color:#a6a6b4}button{padding:10px 18px;margin:0 12px 14px 0;background:#25252e;color:#fff;border:1px solid #9998ff;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#6261ff}img{display:block;max-width:100%;max-height:75vh;margin:auto;border:1px solid #36363f}input{width:100%;margin-top:16px}output{display:block;margin:12px 0;color:#aaa8ff}</style><main><h1>两页标题动效 · 真实帧采样回放</h1><p>来自本地浏览器实际截图，显示标题擦入的不同阶段。5张采样帧不是完整视频，也不用于判断FPS。</p><div><button id="about" aria-pressed="true">关于我</button><button id="records" aria-pressed="false">项目索引</button><button id="play">重新播放</button></div><img id="frame" alt="实际浏览器画面"><input id="slider" type="range" min="0" max="4" value="0" aria-label="选择采样帧"><output id="status"></output></main><script>const frames=[{"scene": "about", "label": "关于我", "file": "about-100.jpg", "clip": "inset(0px 64.1641% 0px 0px)", "time": 116.5, "title": "关于我", "transform": "matrix(1, 0, 0, 1, 25.6656, 0)"}, {"scene": "about", "label": "关于我", "file": "about-280.jpg", "clip": "inset(0px 18.9747% 0px 0px)", "time": 302.70000000298023, "title": "关于我", "transform": "matrix(1, 0, 0, 1, 7.5899, 0)"}, {"scene": "about", "label": "关于我", "file": "about-460.jpg", "clip": "inset(0px 3.5806% 0px 0px)", "time": 483.5, "title": "关于我", "transform": "matrix(1, 0, 0, 1, 1.4322, 0)"}, {"scene": "about", "label": "关于我", "file": "about-650.jpg", "clip": "inset(0px 0.1899% 0px 0px)", "time": 666.6000000089407, "title": "关于我", "transform": "matrix(1, 0, 0, 1, 0.076, 0)"}, {"scene": "about", "label": "关于我", "file": "about-900.jpg", "clip": "none", "time": 918.5, "title": "关于我", "transform": "none"}, {"scene": "records", "label": "项目索引", "file": "records-100.jpg", "clip": "inset(0px 63.7125% 0px 0px)", "time": 117.59999999403954, "title": "项目索引", "transform": "matrix(1, 0, 0, 1, 25.485, 0)"}, {"scene": "records", "label": "项目索引", "file": "records-280.jpg", "clip": "inset(0px 19.4945% 0px 0px)", "time": 296.29999999701977, "title": "项目索引", "transform": "matrix(1, 0, 0, 1, 7.7978, 0)"}, {"scene": "records", "label": "项目索引", "file": "records-460.jpg", "clip": "inset(0px 3.0268% 0px 0px)", "time": 477.70000000298023, "title": "项目索引", "transform": "matrix(1, 0, 0, 1, 1.2107, 0)"}, {"scene": "records", "label": "项目索引", "file": "records-650.jpg", "clip": "inset(0px 0.0856% 0px 0px)", "time": 665.7000000029802, "title": "项目索引", "transform": "matrix(1, 0, 0, 1, 0.0342, 0)"}, {"scene": "records", "label": "项目索引", "file": "records-900.jpg", "clip": "none", "time": 922, "title": "项目索引", "transform": "none"}];let scene='about',timer;const image=document.querySelector('#frame'),slider=document.querySelector('#slider'),status=document.querySelector('#status');function show(i){const f=frames.filter(x=>x.scene===scene)[i];slider.value=i;image.src=f.file;status.textContent=f.label+' · 页面加载后 '+Math.round(f.time)+' ms · 实际采样帧 '+(i+1)+'/5';}function play(){clearTimeout(timer);let list=frames.filter(x=>x.scene===scene);function next(i){show(i);if(i<4)timer=setTimeout(()=>next(i+1),list[i+1].time-list[i].time);}next(0);}for(const name of ['about','records'])document.querySelector('#'+name).onclick=()=>{scene=name;document.querySelector('#about').setAttribute('aria-pressed',name==='about');document.querySelector('#records').setAttribute('aria-pressed',name==='records');play();};document.querySelector('#play').onclick=play;slider.oninput=()=>{clearTimeout(timer);show(Number(slider.value));};play();</script></html>
