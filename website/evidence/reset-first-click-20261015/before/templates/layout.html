<!doctype html>
<html lang="${lang}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="${robots}">
  <meta name="portfolio-revision" content="__PORTFOLIO_REVISION__">
  <meta name="description" content="${description}">
  <meta name="theme-color" content="#111214">
  <title>${title}</title>
  <script>
    // Install before deferred component scripts: an outgoing page snapshot can
    // otherwise intercept the first input while the homepage is still loading.
    addEventListener('pagereveal', function (event) {
      if (event.viewTransition && /\/(?:index\.html)?$$/.test(location.pathname)) event.viewTransition.skipTransition();
    });
    addEventListener('pageswap', function (event) {
      if (!event.viewTransition || !event.activation || !event.activation.entry) return;
      var destination = new URL(event.activation.entry.url);
      if (destination.origin !== location.origin) return;
      var from = location.pathname, to = destination.pathname;
      var list = function (path) { return path.endsWith('/records.html'); };
      var detail = function (path) { return /\/cases\/[^/]+\.html$$/.test(path); };
      var shared = (list(from) && detail(to)) || (detail(from) && list(to));
      if (!shared) event.viewTransition.skipTransition();
    });
  </script>
  ${seo_head}
  <link rel="icon" href="${base}assets/mark.svg?v=blue-20261007" type="image/svg+xml">
  <link rel="stylesheet" href="${base}styles.css?v=20261008-polish">
  <link rel="stylesheet" href="${base}motion.css">
  <link rel="stylesheet" href="${base}assets/social-footer.css">
  <script src="${base}assets/page-version.js" defer></script>
  <script src="${base}assets/vendor/gsap-3.15.0/gsap.min.js" defer></script>
  <script src="${base}app.js?v=20261008-motion" defer></script>
  <script src="${base}assets/depth-gallery.js?v=20261008-continuous" defer></script>
  <script src="${base}motion.js?v=20261008-motion" defer></script>
  <script src="${base}assets/screenshot-viewer.js" defer></script>
</head>
<body>
  <div class="reading-progress" aria-hidden="true"></div>
  <a class="skip" href="#main">跳到正文</a>
  <header class="site-header">
    <a class="brand" href="${base}index.html" aria-label="${name}首页">
      <span class="brand-symbol" aria-hidden="true">*</span><span>${name}</span>
    </a>
    <nav aria-label="主导航">${nav}${language_switch}</nav>
  </header>
  ${body}
  <footer class="site-footer">
    <div class="footer-compact-copy">
      <a class="footer-brand" href="${base}index.html">${name}<span>FDE / SELECTED WORK</span></a>
    </div>
    ${contact}
    <div class="footer-bottom"><nav class="footer-links" aria-label="页面导航"><a href="${base}records.html">项目库 ↗</a><a href="#main">回到顶部 ↑</a></nav>${social_nav}</div>
  </footer>
</body>
</html>
