<main id="main" class="home-main">
  <div class="home-ambient" data-home-ambient data-active="false" aria-hidden="true">
    <div class="ambient-parallax">
      <div class="ambient-glow ambient-glow-one"></div><div class="ambient-glow ambient-glow-two"></div>
      <svg class="ambient-contours" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="xMidYMid slice" focusable="false">
        <defs><linearGradient id="ambient-ink" x1="0" y1="150" x2="1440" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#9698ff" stop-opacity=".16"/><stop offset=".45" stop-color="#9698ff" stop-opacity=".035"/><stop offset="1" stop-color="#7f9cec" stop-opacity=".18"/></linearGradient></defs>
        <g stroke="url(#ambient-ink)" stroke-width="1">
          <path d="M-150 130C160 10 250 420 620 320S1110 100 1590 330"/><path d="M-150 155C160 35 250 445 620 345S1110 125 1590 355"/>
          <path d="M-150 180C160 60 250 470 620 370S1110 150 1590 380"/><path d="M-150 205C160 85 250 495 620 395S1110 175 1590 405"/>
          <path d="M-150 550C180 760 430 410 800 620S1260 840 1590 620"/><path d="M-150 575C180 785 430 435 800 645S1260 865 1590 645"/>
          <path d="M-150 600C180 810 430 460 800 670S1260 890 1590 670"/><path d="M-150 625C180 835 430 485 800 695S1260 915 1590 695"/>
        </g>
      </svg>
    </div>
  </div>
  <section class="portfolio-intro" aria-label="个人介绍">
    <button class="ambient-control" type="button" data-ambient-control aria-pressed="false" hidden><span class="ambient-control-icon" aria-hidden="true"></span><span>背景动效</span></button>
    <div class="hero-signature">
      <span class="hello-mark" aria-hidden="true">HELLO,</span>
      <p class="hero-name" aria-label="${public_name}"><span class="hero-prefix" aria-hidden="true">I’M</span><span data-kinetic-letter aria-hidden="true">E</span><span data-kinetic-letter aria-hidden="true">L</span><span data-kinetic-letter aria-hidden="true">I</span><svg class="hero-spark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 2V98M2 50H98M16 16L84 84M84 16L16 84" fill="none" stroke="currentColor" stroke-width="12"/></svg></p>
    </div>
    <div class="intro-copy">
      <p class="intro-role">${role}</p>
      <h1 data-motion-title>${headline}</h1>
      <p class="intro-description">${intro}</p>
      <ul class="intro-capabilities" aria-label="服务方式">${capability_items}</ul>
      <p class="intro-proof"><strong>30+</strong><span>跨行业成功案例</span></p>
      <div class="intro-actions"><a class="primary" data-magnetic href="about.html#contact">免费咨询 <span aria-hidden="true">↗</span></a><a class="text-link" data-magnetic href="#work">看实际案例 <span aria-hidden="true">↓</span></a></div>
    </div>
  </section>
  ${customer_topics}
  <section class="selected-work" id="work" aria-labelledby="work-title">
    <div class="work-heading"><h2 id="work-title">代表项目</h2><a class="text-link" href="records.html">项目库 <span aria-hidden="true">↗</span></a></div>
    <div class="depth-stage" data-depth-stage tabindex="0" aria-label="代表项目纵深展示，可向下滚动或使用上一项和下一项按钮">
      <div class="depth-controls" hidden><p class="depth-position" aria-live="polite"></p><p class="depth-hint" data-depth-hint></p><div><button type="button" data-depth-prev aria-label="上一个案例">←</button><button type="button" data-depth-next aria-label="下一个案例">→</button></div></div>
      <div class="poster-gallery" data-gallery>${featured_gallery}</div>
    </div>
  </section>
</main>
