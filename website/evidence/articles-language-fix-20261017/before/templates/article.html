<main id="main" class="detail-main article-main">
  <div class="case-breadcrumb"><a class="text-link" href="../articles.html">← 返回实践文章</a><span>${category}</span></div>
  <header class="detail-header article-header">
    <p class="article-byline">Eli · 写于 <time datetime="${date}">${date}</time> · ${reading}</p>
    <h1 data-motion-title>${title}</h1>
    <p class="detail-intro">${intro}</p>
    <p class="article-takeaway">${takeaway}</p>
  </header>
  <div class="detail-grid">
    <aside><h2>文章目录</h2><nav class="case-index" aria-label="文章目录">${section_index}</nav></aside>
    <article class="detail-content article-content">${sections}</article>
  </div>
  <section class="case-contact"><div><h2>先聊一项具体工作</h2><p>说说现在怎么做、哪一步最费时间。初次沟通免费。</p></div><a class="text-link" href="../about.html#contact">免费聊聊 ↗</a></section>
  <div class="article-service"><a class="text-link" href="../services/${service}.html">${service_label} ↗</a></div>
  <section class="article-next" aria-labelledby="article-next-title"><h2 id="article-next-title">继续阅读</h2>${related}</section>
</main>
