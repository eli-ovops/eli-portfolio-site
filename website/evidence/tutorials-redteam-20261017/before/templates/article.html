<main id="main" class="detail-main article-main">
  <div class="case-breadcrumb"><a class="text-link" data-article-back href="../articles.html">${back_label}</a><span>${category}</span></div>
  <header class="detail-header article-header">
    <p class="article-byline">Eli · ${written_label} <time datetime="${date}">${date}</time> · ${reading}</p>
    <h1 data-motion-title>${title}</h1>
    <p class="detail-intro">${intro}</p>
    <p class="article-takeaway">${takeaway}</p>
  </header>
  <div class="detail-grid">
    <aside><h2>${index_label}</h2><nav class="case-index" aria-label="${index_label}">${section_index}</nav></aside>
    <article class="detail-content article-content">${sections}</article>
  </div>
  <section class="case-contact"><div><h2>${contact_heading}</h2><p>${contact_copy}</p></div><a class="text-link" href="../about.html#contact">${consult_label} ↗</a></section>
  <div class="article-service"><a class="text-link" href="../services/${service}.html">${service_label} ↗</a></div>
  <section class="article-next" aria-labelledby="article-next-title"><h2 id="article-next-title">${next_label}</h2>${related}</section>
  <script defer src="../assets/article-library.js"></script>
</main>
