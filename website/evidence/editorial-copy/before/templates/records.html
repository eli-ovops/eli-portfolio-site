<main id="main" class="records-main">
  <header class="records-heading"><h1>作品与探索。</h1><p>网站、工具、应用，以及研究过的想法。</p></header>
  <section id="archive"><details class="archive-disclosure" open>
    <summary>全部作品 <span aria-hidden="true">＋</span></summary>
    <div class="archive-tools" data-enhance hidden><div class="filters" aria-label="作品分类">${filters}</div><div class="search-field"><label for="search">搜索作品</label><input type="search" id="search" placeholder="项目名称、功能或方向" autocomplete="off"></div></div>
    <p class="result-count" aria-live="polite">38 项作品与探索</p><ul class="archive-list">${archive}</ul>
    <div class="empty" hidden><p>还没有找到匹配的作品。</p><button type="button" class="reset-search text-link">清除筛选 ↗</button></div>
  </details></section>
</main>
